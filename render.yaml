# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: subtracker-api
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Required for OTP on Render free tier (SMTP ports blocked — use Brevo HTTP API)
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "SubTracker <ankityadavbkpur@gmail.com>"
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
