version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  # Amplify Console → Environment variables (required):
  # VITE_API_URL = https://subtracker-1-tsuh.onrender.com/api
